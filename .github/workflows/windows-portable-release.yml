name: Windows Portable Release

on:
  push:
    branches:
      - 6.1.7
  workflow_dispatch:
  pull_request:
    branches: ['6.1.7']

permissions:
  contents: write

concurrency:
  group: windows-portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Windows portable amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test portable updater
        run: node scripts/test-portable-update.js

      - name: Test with the packaged Electron Node runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $updaterTest = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList 'scripts/test-portable-update.js' -NoNewWindow -Wait -PassThru
          if ($updaterTest.ExitCode -ne 0) { throw "Electron runtime updater tests failed: $($updaterTest.ExitCode)" }

      - name: Build custom web application
        run: npm run build:web

      - name: Configure portable-only app build
        shell: pwsh
        run: |
          $path = 'build-app.js'
          $content = Get-Content $path -Raw
          $content = $content.Replace("        await packager.buildIS('64');`r`n", '')
          $content = $content.Replace("        await packager.buildIS('32');`r`n", '')
          $content = $content.Replace("        await packager.buildZIP('32');`r`n", '')
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Pre-download Electron runtime
        shell: pwsh
        run: |
          $dest = 'redist\electron-v6.1.7-win32-x64.zip'
          New-Item -ItemType Directory -Path 'redist' -Force | Out-Null
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Invoke-WebRequest -Uri 'https://github.com/electron/electron/releases/download/v6.1.7/electron-v6.1.7-win32-x64.zip' -OutFile $dest
          $file = Get-Item $dest
          if ($file.Length -lt 1000000) {
            throw "Electron runtime download is incomplete: $($file.Length) bytes"
          }
          Write-Host "Electron runtime ready: $($file.Length) bytes"

      - name: Build Windows portable amd64
        run: npm run build:app

      - name: Inject custom web cache into portable amd64 build
        shell: pwsh
        run: |
          $portableDir = Get-ChildItem -Path build -Directory -Filter 'hakuneko-desktop_*_windows-portable_amd64' | Select-Object -First 1
          if (-not $portableDir) { throw 'Portable amd64 build directory was not produced.' }
          $cacheDir = Join-Path $portableDir.FullName 'cache'
          if (Test-Path $cacheDir) { Remove-Item $cacheDir -Recurse -Force }
          New-Item -ItemType Directory -Path $cacheDir | Out-Null
          Copy-Item -Path 'build\web\*' -Destination $cacheDir -Recurse -Force

          node scripts/build-portable-update.js $portableDir.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Update package generation failed.' }

          $zipPath = "$($portableDir.FullName).zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Push-Location (Split-Path $portableDir.FullName -Parent)
          7z a $zipPath ".\$($portableDir.Name)" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP generation failed.' }
          Pop-Location

      - name: Locate portable amd64 archive
        id: portable
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path build -Filter 'hakuneko-desktop_*_windows-portable_amd64.zip' | Select-Object -First 1
          if (-not $asset) { throw 'Portable amd64 ZIP was not produced.' }
          "asset=$($asset.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($asset.Name)" >> $env:GITHUB_OUTPUT

      - name: Create or update release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/6.1.7'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.1.7-bookmark-auto-update
          ASSET: ${{ steps.portable.outputs.asset }}
        run: |
          $notes = @"
          Custom HakuNeko 6.1.7 portable build.

          Added:
          - Check bookmarked manga for new chapters on startup
          - Automatically queue newly discovered chapters for download
          - First successful scan creates a baseline and does not download historical chapters
          - Update state is stored separately from the existing bookmark file
          - Custom web app is bundled into the portable package
          - Upstream web auto-update is disabled by default so the custom feature is not overwritten
          - On startup, this portable build checks this repository for verified custom application updates

          Portable user data remains inside the package folder under userdata.
          "@

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'HakuNeko 6.1.7 - Bookmark Auto Update' --notes $notes
          }

          gh release upload $env:TAG $env:ASSET --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Portable upload failed.' }

          # Immutable payload first; manifest last. Old manifests continue to
          # reference available files while a new release is being published.
          $payload = "build/hakuneko-update-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          gh release upload $env:TAG $payload --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Update payload upload failed.' }
          gh release upload $env:TAG 'build/custom-update.json' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest upload failed.' }
