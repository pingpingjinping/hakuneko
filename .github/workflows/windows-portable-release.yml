name: Windows Portable Release

on:
  push:
    branches:
      - 6.1.7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows portable amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows packages
        run: npm run build:app

      - name: Locate portable amd64 archive
        id: portable
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path build -Filter 'hakuneko-desktop_*_windows-portable_amd64.zip' | Select-Object -First 1
          if (-not $asset) { throw 'Portable amd64 ZIP was not produced.' }
          "asset=$($asset.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($asset.Name)" >> $env:GITHUB_OUTPUT

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.1.7-bookmark-auto-update
          ASSET: ${{ steps.portable.outputs.asset }}
        run: |
          $notes = @"
          Custom HakuNeko 6.1.7 portable build from the 6.1.7 branch.

          Added:
          - Check bookmarked manga for new chapters on startup
          - Automatically queue newly discovered chapters for download
          - First successful scan creates a baseline and does not download historical chapters
          - Update state is stored separately from the existing bookmark file
          "@

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'HakuNeko 6.1.7 - Bookmark Auto Update' --notes $notes
          }

          gh release upload $env:TAG $env:ASSET --repo $env:GITHUB_REPOSITORY --clobber
