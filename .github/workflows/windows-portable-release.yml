name: Windows Portable Release

on:
  push:
    branches:
      - 6.1.7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows portable amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build custom web application
        run: npm run build:web

      - name: Configure portable-only app build
        shell: pwsh
        run: |
          $path = 'build-app.js'
          $content = Get-Content $path -Raw
          $content = $content.Replace("        await packager.buildIS('64');`r`n", '')
          $content = $content.Replace("        await packager.buildIS('32');`r`n", '')
          $content = $content.Replace("        await packager.buildZIP('32');`r`n", '')
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build Windows portable amd64
        run: npm run build:app

      - name: Inject custom web cache into portable amd64 build
        shell: pwsh
        run: |
          $portableDir = Get-ChildItem -Path build -Directory -Filter 'hakuneko-desktop_*_windows-portable_amd64' | Select-Object -First 1
          if (-not $portableDir) { throw 'Portable amd64 build directory was not produced.' }
          $cacheDir = Join-Path $portableDir.FullName 'cache'
          if (Test-Path $cacheDir) { Remove-Item $cacheDir -Recurse -Force }
          New-Item -ItemType Directory -Path $cacheDir | Out-Null
          Copy-Item -Path 'build\web\*' -Destination $cacheDir -Recurse -Force

          $zipPath = "$($portableDir.FullName).zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Push-Location (Split-Path $portableDir.FullName -Parent)
          7z a $zipPath ".\$($portableDir.Name)" | Out-Host
          Pop-Location

      - name: Locate portable amd64 archive
        id: portable
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path build -Filter 'hakuneko-desktop_*_windows-portable_amd64.zip' | Select-Object -First 1
          if (-not $asset) { throw 'Portable amd64 ZIP was not produced.' }
          "asset=$($asset.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($asset.Name)" >> $env:GITHUB_OUTPUT

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v6.1.7-bookmark-auto-update
          ASSET: ${{ steps.portable.outputs.asset }}
        run: |
          $notes = @"
          Custom HakuNeko 6.1.7 portable build.

          Added:
          - Check bookmarked manga for new chapters on startup
          - Automatically queue newly discovered chapters for download
          - First successful scan creates a baseline and does not download historical chapters
          - Update state is stored separately from the existing bookmark file
          - Custom web app is bundled into the portable package
          - Upstream web auto-update is disabled by default so the custom feature is not overwritten

          Portable user data remains inside the package folder under userdata.
          "@

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'HakuNeko 6.1.7 - Bookmark Auto Update' --notes $notes
          }

          gh release upload $env:TAG $env:ASSET --repo $env:GITHUB_REPOSITORY --clobber
