<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HakuNeko</title>
    <link rel="icon" href="./img/logo.png">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">
    <script src="./js/protobufjs.min.js"></script>
    <script src="./js/crypto-js.min.js"></script>
    <script src="./js/oauth-1.0a.min.js"></script>
    <script src="./js/jszip.min.js" defer></script>
    <script src="./js/pdfkit.standalone.js" defer></script>
    <script src="./js/hls.light.min.js" defer></script>
    <script src="./js/ass.min.js" defer></script>
    <script src="./js/sql.min.js" defer></script>
    <script src="./js/exif-js.min.js" defer></script>
    <script type="module">
        const electronDialog = require('electron').remote.dialog
        import HakuNeko from './mjs/HakuNeko.mjs'

        function replaceDialogs() {
            alert = async (message, title, type) => {
                let options = {
                    type: type || 'info',
                    title: title || 'HakuNeko',
                    message: message,
                    buttons: [ 'OK' ]
                };
                let response = await electronDialog.showMessageBox(options);
                return response === options.buttons.indexOf('OK');
            };
            confirm = async (message, title, type, buttons) => {
                let options = {
                    type: type || 'question',
                    title: title || 'HakuNeko',
                    message: message,
                    buttons: buttons || [ 'Yes', 'No' ]
                };
                let response = await electronDialog.showMessageBox(options);
                return response.response === 0;
            };
        }

        function loadBookmarks() {
            return new Promise(resolve => {
                Engine.BookmarkManager.loadProfile('default', error => resolve(error));
            });
        }

        async function loadEngine() {
            console.log('Loading Engine:', 'HakuNeko');
            window.HakuNeko = new HakuNeko(window);
            window.Engine = window.HakuNeko;
            await Engine.initialize();
            await Engine.Settings.load();
            await loadBookmarks();
            Engine.ChaptermarkManager.loadChaptermarks(undefined);
        }

        function loadFrontend() {
            let identifier = Engine.Settings.frontend.value;
            console.log('Loading Frontend:', identifier);
            loadClassicPolymer(identifier);
        }

        function loadClassicPolymer(identifier) {
            let element = document.createElement('hakuneko-app');
            document.body.appendChild(element);
            let webcomponents = document.createElement('script');
            webcomponents.src = './lib/webcomponentsjs/webcomponents-loader.js';
            document.head.appendChild(webcomponents);
            let frontend = document.createElement('link');
            frontend.href = `./lib/hakuneko/${identifier}/app.html`;
            frontend.rel = 'import';
            document.head.appendChild(frontend);
        }

        function closeNotification() {
            let notification = document.querySelector('#notification');
            notification.parentNode.removeChild(notification);
        }

        function resultText(result, languageLabel) {
            let label = languageLabel || result.languageLabel || '선택 언어';
            return `건너뜀 ${result.skipped || 0}` +
                ` · 온라인 ${result.online}` +
                ` · ${label} ${result.targetTotal || 0}` +
                ` · 미다운로드 ${result.targetMissing || 0}` +
                ` · 큐추가 ${result.queued}` +
                ` · 실패 ${result.failed}`;
        }

        function setupBookmarkUpdateUI() {
            let manager = Engine.BookmarkUpdateManager;
            let status = document.querySelector('#bookmark-update-status');
            let button = document.querySelector('#bookmark-update-button');
            let downloadButton = document.querySelector('#bookmark-download-summary');
            let downloadModal = document.querySelector('#bookmark-download-modal');
            let downloadModalClose = document.querySelector('#bookmark-download-modal-close');
            let downloadModalMeta = document.querySelector('#bookmark-download-modal-meta');
            let downloadModalList = document.querySelector('#bookmark-download-modal-list');
            let scanSummary = '북마크 업데이트 대기 중';
            let downloadState = {
                queued: 0,
                downloading: 0,
                completed: 0,
                failed: 0,
                total: 0,
                items: []
            };

            let renderStatus = () => {
                status.textContent = scanSummary;
            };

            let getStatusLabel = value => {
                switch(value) {
                    case 'queued':
                        return '대기';
                    case 'downloading':
                        return '다운로드 중';
                    case 'completed':
                        return '완료';
                    case 'failed':
                        return '실패';
                    default:
                        return value || '알 수 없음';
                }
            };

            let renderDownloadSummary = () => {
                if(downloadState.total > 0) {
                    downloadButton.hidden = false;
                    downloadButton.disabled = false;
                    downloadButton.textContent = '목록';
                    downloadButton.title = '이번 실행 자동 다운로드 목록 보기';
                } else {
                    downloadButton.hidden = true;
                    downloadButton.disabled = true;
                }
            };

            let renderDownloadDetails = () => {
                downloadModalMeta.textContent =
                    `총 ${downloadState.total}개` +
                    ` · 대기 ${downloadState.queued}` +
                    ` · 진행 ${downloadState.downloading}` +
                    ` · 완료 ${downloadState.completed}` +
                    ` · 실패 ${downloadState.failed}`;
                downloadModalList.textContent = '';

                for(let item of downloadState.items || []) {
                    let row = document.createElement('div');
                    row.className = 'bookmark-download-item';

                    let text = document.createElement('div');
                    text.className = 'bookmark-download-item-text';

                    let title = document.createElement('div');
                    title.className = 'bookmark-download-item-title';
                    let manga = item.manga || '(작품명 없음)';
                    let chapter = item.chapter || '(화 정보 없음)';
                    title.textContent = manga + ' — ' + chapter;

                    let connector = document.createElement('div');
                    connector.className = 'bookmark-download-item-connector';
                    connector.textContent = item.connector || '';

                    let state = document.createElement('div');
                    state.className = 'bookmark-download-item-state';
                    state.textContent = getStatusLabel(item.status);

                    text.appendChild(title);
                    if(item.connector) {
                        text.appendChild(connector);
                    }
                    row.appendChild(text);
                    row.appendChild(state);
                    downloadModalList.appendChild(row);
                }
            };

            let closeDownloadDetails = () => {
                downloadModal.hidden = true;
            };

            let openDownloadDetails = () => {
                if(downloadState.total < 1) {
                    return;
                }
                renderDownloadDetails();
                downloadModal.hidden = false;
            };

            let runCheck = () => {
                if(manager.isRunning) {
                    return;
                }
                manager.checkForUpdates({ force: true }).catch(error => {
                    button.disabled = false;
                        scanSummary = `북마크 검사 오류: ${error.message || error}`;
                    renderStatus();
                    renderDownloadSummary();
                    console.error('Bookmark update check failed:', error);
                });
            };

            button.addEventListener('click', runCheck);
            downloadButton.addEventListener('click', openDownloadDetails);
            downloadModalClose.addEventListener('click', closeDownloadDetails);
            downloadModal.addEventListener('click', event => {
                if(event.target === downloadModal) {
                    closeDownloadDetails();
                }
            });
            document.addEventListener('keydown', event => {
                if(event.key === 'Escape' && !downloadModal.hidden) {
                    closeDownloadDetails();
                }
            });

            manager.addEventListener('started', event => {
                let detail = event.detail;
                button.disabled = true;
                let mode = detail.force ? '전체 강제 검사' : '12시간 캐시 검사';
                scanSummary =
                    `북마크 업데이트 확인 중... 0 / ${detail.total}` +
                    ` · ${mode}` +
                    ` · ${detail.parallel}개 병렬` +
                    ` · ${detail.languageLabel}`;
                renderStatus();
                renderDownloadSummary();
            });

            manager.addEventListener('progress', event => {
                let detail = event.detail;
                let result = detail.result;
                let manga = detail.title ? ` · ${detail.title}` : '';
                scanSummary =
                    `북마크 ${detail.current} / ${detail.total}` +
                    ` · ${resultText(result, detail.languageLabel)}` + manga;
                renderStatus();
            });

            manager.addEventListener('finished', event => {
                let result = event.detail;
                button.disabled = false;
                scanSummary =
                    `완료 · 확인 ${result.checked}` +
                    ` · ${resultText(result, result.languageLabel)}` +
                    ` · ${result.parallel}개 병렬`;
                renderStatus();
                renderDownloadSummary();
            });

            manager.addEventListener('download-status', event => {
                downloadState = Object.assign({
                    queued: 0,
                    downloading: 0,
                    completed: 0,
                    failed: 0,
                    total: 0,
                    items: []
                }, event.detail || {});
                renderDownloadSummary();
                if(!downloadModal.hidden) {
                    renderDownloadDetails();
                }
            });

            if(manager.isRunning) {
                button.disabled = true;
                scanSummary = '북마크 업데이트 확인 중...';
            }
            renderStatus();
            renderDownloadSummary();
        }

        async function main() {
            replaceDialogs();
            await loadEngine();
            setupBookmarkUpdateUI();
            loadFrontend();

            if(Engine.Settings.autoCheckBookmarkUpdates.value) {
                setTimeout(() => {
                    Engine.BookmarkUpdateManager.checkForUpdates()
                        .catch(error => console.error('Bookmark update check failed:', error));
                }, 0);
            }
        }

        main();
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-y: hidden;
        }

        #notification {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            margin: 0.5em;
            padding: 0.5em;
            box-shadow: 0px 2px 4px 2px #808080;
            background-color: #fff8f0;
            border: 1px solid #ffc0c0;
            border-radius: 0.25em;
            font-family: sans-serif;
            text-align: center;
            z-index: 2;
        }

        #notification a {
            text-decoration: none;
            cursor: pointer;
        }

        #notification > #close {
            position: absolute;
            margin-top: -2px;
            right: 1em;
            cursor: pointer;
        }

        #bookmark-update-panel {
            position: fixed;
            left: calc(50% + 0.75em);
            right: 0.75em;
            bottom: 0.75em;
            display: flex;
            align-items: center;
            gap: 0.75em;
            box-sizing: border-box;
            padding: 0.55em 0.65em;
            border-radius: 0.35em;
            background: rgba(32, 32, 32, 0.92);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            font: 12px sans-serif;
            z-index: 1;
        }

        #bookmark-update-status {
            flex: 1;
            overflow: hidden;
            white-space: normal;
            line-height: 1.35;
            max-height: 2.7em;
        }

        #bookmark-download-summary {
            flex: none;
            padding: 0.35em 0.55em;
            overflow: hidden;
            border: 1px solid #777777;
            border-radius: 0.25em;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #bookmark-download-summary:disabled {
            cursor: default;
            opacity: 0.65;
        }

        #bookmark-download-summary[hidden] {
            display: none;
        }

        #bookmark-update-button {
            flex: none;
            padding: 0.35em 0.6em;
            border: 1px solid #aaaaaa;
            border-radius: 0.25em;
            background: #f2f2f2;
            color: #222222;
            cursor: pointer;
        }

        #bookmark-update-button:disabled {
            cursor: default;
            opacity: 0.55;
        }

        #bookmark-download-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5em;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.58);
            font: 13px sans-serif;
            z-index: 10000;
        }

        #bookmark-download-modal[hidden] {
            display: none;
        }

        .bookmark-download-dialog {
            width: calc(100% - 3em);
            max-width: 42em;
            max-height: calc(100% - 3em);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #555555;
            border-radius: 0.45em;
            background: #202020;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
        }

        .bookmark-download-dialog-header {
            display: flex;
            align-items: center;
            padding: 0.8em 1em;
            border-bottom: 1px solid #444444;
            font-size: 1.1em;
        }

        .bookmark-download-dialog-header strong {
            flex: 1;
        }

        #bookmark-download-modal-close {
            flex: none;
            border: 0;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            font-size: 1.35em;
            line-height: 1;
        }

        #bookmark-download-modal-meta {
            padding: 0.7em 1em;
            color: #cccccc;
            border-bottom: 1px solid #3a3a3a;
        }

        #bookmark-download-modal-list {
            overflow-y: auto;
        }

        .bookmark-download-item {
            display: flex;
            align-items: center;
            gap: 1em;
            padding: 0.75em 1em;
            border-bottom: 1px solid #333333;
        }

        .bookmark-download-item:last-child {
            border-bottom: 0;
        }

        .bookmark-download-item-text {
            min-width: 0;
            flex: 1;
        }

        .bookmark-download-item-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .bookmark-download-item-connector {
            margin-top: 0.2em;
            overflow: hidden;
            color: #aaaaaa;
            font-size: 0.9em;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .bookmark-download-item-state {
            flex: none;
            color: #dddddd;
        }
    </style>
</head>
<body>
    <div id="notification">
        A new <strong>HakuNeko Desktop Client</strong> is available for download on
        <a href="https://github.com/manga-download/hakuneko/releases" target="_blank">GitHub</a>
        <span id="close" onclick="closeNotification()" title="Hide notification">✖</span>
    </div>
    <div id="bookmark-update-panel">
        <span id="bookmark-update-status">북마크 업데이트 대기 중 · 설정에서 병렬 수/언어 변경 가능</span>
        <button id="bookmark-download-summary" type="button" hidden>목록</button>
        <button id="bookmark-update-button" type="button">지금 확인</button>
    </div>
    <div id="bookmark-download-modal" hidden>
        <div class="bookmark-download-dialog">
            <div class="bookmark-download-dialog-header">
                <strong>이번 실행 자동 다운로드</strong>
                <button id="bookmark-download-modal-close" type="button" title="닫기">×</button>
            </div>
            <div id="bookmark-download-modal-meta"></div>
            <div id="bookmark-download-modal-list"></div>
        </div>
    </div>
</body>
</html>
